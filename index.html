<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEEEA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>如烟 · Mastery Path</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== The Rebuild family look (shared with Vocal Harmony v40+): eucalyptus palette, Archivo display, bottom tabs, dark mode.
   Every colour is a token — never hard-code one in CSS or generated markup. ===== */
:root{
  color-scheme:light;
  --bg:#ECEEEA;--surface:#FFFFFF;--surface2:#F5F6F3;--border:#DCE0DB;--border2:#C9CFC9;
  --text:#15191B;--text2:#3A4246;--muted:#61696E;--muted2:#8A9196;
  --accent:#2C6A5A;--accent-bg:#DCEAE4;--accent-line:#B9D5C9;--accent-hover:#22564A;--on-accent:#FFFFFF;
  --amber:#8A5510;--amber-bg:#F5E6CF;--amber-line:#E2C48F;
  --purple:#6B3FA0;--purple-bg:#F0E8F7;--purple-line:#D5C3EA;
  --red:#9B2C2C;--red-bg:#F8E4E2;--on-red:#FFFFFF;
  --track:#E3E7E2;--scrim:rgba(17,21,20,0.45);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --tabbar-h:64px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111514;--surface:#1A1F1D;--surface2:#232A27;--border:#2F3633;--border2:#434C48;
  --text:#E7ECE9;--text2:#C4CCC8;--muted:#9AA4A0;--muted2:#7F8984;
  --accent:#6DBFA6;--accent-bg:#1E3832;--accent-line:#2F5A4E;--accent-hover:#86CDB7;--on-accent:#0B1A15;
  --amber:#E2AA55;--amber-bg:#33281A;--amber-line:#5A4524;
  --purple:#C7B0EA;--purple-bg:#2A2236;--purple-line:#4A3D60;
  --red:#EC7B74;--red-bg:#3A1F1E;--on-red:#2A0F0E;
  --track:#2A322F;--scrim:rgba(0,0,0,0.6);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.5);--shadow:0 4px 16px rgba(0,0,0,0.5);--shadow-lg:0 12px 40px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;overflow-x:clip;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font:inherit;color:inherit;}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}
.display{font-family:var(--f-display);font-weight:800;letter-spacing:-0.02em;line-height:1.04;color:var(--text);}
.eyebrow{font-family:var(--f-mono);font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);}
/* header + menu */
.topbar{position:sticky;top:0;z-index:200;}
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo-zh{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--text);}
.logo-en{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--accent);}
.logo-v{font-family:var(--f-mono);font-size:0.68rem;color:var(--muted);}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.storage-banner{background:var(--amber-bg);color:var(--amber);font-size:0.78rem;padding:8px 16px;text-align:center;font-weight:600;display:none;}
.menu-scrim{display:none;position:fixed;inset:0;z-index:950;}
.menu-scrim.open{display:block;}
.menu{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 62px);right:12px;z-index:960;width:min(300px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:8px;}
.menu.open{display:block;}
.menu-h{font-family:var(--f-mono);font-size:0.68rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px;}
.menu-item{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:0 10px;border:0;background:none;border-radius:10px;font-size:0.92rem;font-weight:600;color:var(--text);cursor:pointer;text-align:left;}
.menu-item:hover{background:var(--surface2);}
.menu-item .ico{color:var(--muted);}
.menu-item.danger,.menu-item.danger .ico{color:var(--red);}
.menu-sep{height:1px;background:var(--border);margin:6px 4px;}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface2);}
.seg-b{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--text2);font-size:0.88rem;font-weight:600;cursor:pointer;padding:0 8px;}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700;}
.menu .seg{margin:0 4px 4px;}
.seg.sm{padding:3px;border-radius:12px;}
.seg.sm .seg-b{min-height:34px;font-size:0.8rem;padding:0 12px;}
/* tab bar + page frame */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:800;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font-size:0.72rem;font-weight:600;cursor:pointer;}
.tab .ico{width:24px;height:24px;stroke-width:1.8;}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:0.86rem;font-weight:700;z-index:999;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .2s,visibility .2s;}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
.toast.top{top:calc(env(safe-area-inset-top) + 72px);bottom:auto;transform:translateX(-50%) translateY(-16px);}
.toast.top.show{transform:translateX(-50%) translateY(0);}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.page-head h1{font-size:2.2rem;}
.page-count{font-family:var(--f-mono);font-size:0.82rem;font-weight:600;color:var(--muted);}
.page-sub{font-size:0.88rem;color:var(--text2);margin-top:8px;line-height:1.45;}
.pbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:12px;}
.pbar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
/* cards, pills, buttons */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:14px;}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-title{font-size:1rem;font-weight:700;color:var(--text);line-height:1.25;}
.card-sub{font-size:0.84rem;color:var(--text2);margin-top:3px;line-height:1.45;}
.card-eyebrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.card-eyebrow > span:last-child{white-space:nowrap;}
.card-foot{font-size:0.8rem;color:var(--muted);line-height:1.45;margin-top:10px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:0.82rem;font-weight:600;color:var(--text2);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.pill .ico{width:14px;height:14px;stroke-width:2.6;}
.pill.amber{background:var(--amber-bg);border-color:transparent;color:var(--amber);}
.pill.ok{background:var(--accent-bg);border-color:transparent;color:var(--accent);}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip2{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:0.8rem;font-weight:500;color:var(--text2);}
.chip2 .ico{width:14px;height:14px;color:var(--muted);}
.cta{width:100%;min-height:56px;margin-top:16px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
.cta:hover{background:var(--accent-hover);}
.cta-sec{width:100%;min-height:46px;margin-top:10px;border-radius:14px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:0.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;text-align:center;}
.btn-outline{flex:none;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-size:0.9rem;font-weight:700;cursor:pointer;}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.mini-note{text-align:center;font-size:0.86rem;color:var(--text2);margin-top:12px;}
.hero{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
.hero h1{font-size:2.5rem;}
.hero-focus{font-size:0.95rem;line-height:1.5;color:var(--text2);}
/* today: session blocks + song map */
.blk{display:flex;align-items:center;gap:12px;min-height:54px;border-top:1px solid var(--border);}
.card-eyebrow + .blk{margin-top:8px;border-top:0;}
.blk-m{flex:none;width:58px;height:30px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-family:var(--f-mono);font-size:0.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;}
.blk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.blk-t b{font-size:0.95rem;font-weight:700;color:var(--text);line-height:1.25;}
.blk-t span{font-size:0.82rem;color:var(--text2);line-height:1.35;}
.songbar{display:flex;gap:3px;height:14px;margin-top:12px;}
.songbar i{border-radius:4px;background:var(--track);}
.songbar i.done{background:var(--accent);}
.songbar i.learn{background:var(--accent-line);box-shadow:inset 0 0 0 1.5px var(--accent);}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:0.78rem;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--track);display:inline-block;}
.legend i.done{background:var(--accent);}
.legend i.learn{background:var(--accent-line);box-shadow:inset 0 0 0 1.5px var(--accent);}
/* path roadmap */
.road-list{position:relative;margin-top:18px;}
.road-list::before{content:'';position:absolute;left:19px;top:24px;bottom:30px;width:2px;background:var(--border2);}
.rm{position:relative;}
.rm-row{display:flex;align-items:center;gap:10px;}
.rm-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;border:0;background:none;padding:0;text-align:left;cursor:pointer;}
.rm-node{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);}
.rm-node.done{background:var(--accent);color:var(--on-accent);}
.rm-node.done .ico{width:18px;height:18px;stroke-width:2.6;}
.rm-node.lock{background:var(--surface2);border:1px solid var(--border);}
.rm-node svg.ring{position:absolute;inset:0;}
.ring-t{stroke:var(--track);}
.ring-f{stroke:var(--accent);}
.rm-node .n{position:relative;font-family:var(--f-display);font-weight:800;font-size:0.95rem;color:var(--accent);}
.rm-node.lock .n{color:var(--muted);}
.rm-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.rm-eyebrow{font-family:var(--f-mono);font-size:0.68rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.rm-title{font-size:1rem;font-weight:700;color:var(--text);line-height:1.2;}
.rm.locked .rm-title{color:var(--text2);}
.rm-chev{flex:none;color:var(--muted);display:flex;transition:transform .15s;}
.rm-chev .ico{width:18px;height:18px;}
.rm.open .rm-chev{transform:rotate(180deg);}
.pill-btn{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--purple-line);background:var(--purple-bg);color:var(--purple);font-size:0.8rem;font-weight:600;cursor:pointer;}
.rm-card{margin:0 0 12px 52px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px 4px;}
.rm-goal{font-size:0.84rem;color:var(--text2);line-height:1.5;padding-bottom:10px;}
.ls{display:flex;align-items:center;gap:11px;width:100%;min-height:48px;border:0;border-top:1px solid var(--border);background:none;padding:6px 0;text-align:left;color:var(--text);cursor:pointer;}
div.ls{cursor:default;}
.ls-ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ls-ic.done{background:var(--accent);color:var(--on-accent);}
.ls-ic.done .ico{width:12px;height:12px;stroke-width:3.4;}
.ls-ic.next{border:2px solid var(--accent);}
.ls-ic.next::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);}
.ls-ic.todo{border:2px solid var(--border2);}
.ls-ic.lock{color:var(--muted2);}
.ls-ic.lock .ico{width:15px;height:15px;}
.ls-ic.cp::after{content:'';width:11px;height:11px;background:var(--purple);transform:rotate(45deg);border-radius:2px;}
.ls-t{flex:1;min-width:0;font-size:0.92rem;font-weight:500;line-height:1.3;}
.ls.next .ls-t{font-weight:700;}
.ls.locked .ls-t{color:var(--muted);}
.ls-tag{flex:none;font-size:0.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--accent-bg);color:var(--accent);}
.ls-tag.m{background:none;color:var(--muted);font-weight:600;padding:4px 0;font-family:var(--f-mono);}
.gymrow{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:0 14px;margin-top:8px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);text-align:left;cursor:pointer;color:var(--text);}
.gym-ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--amber-bg);color:var(--amber);display:flex;align-items:center;justify-content:center;}
.tag-amber{flex:none;min-height:26px;padding:0 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:0.78rem;font-weight:600;display:inline-flex;align-items:center;}
/* lesson + session overlays */
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:899;}
.scrim.open{display:block;}
.detail{display:none;position:fixed;inset:0;z-index:910;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;}
.detail.open{display:flex;}
.d-close{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);font-family:var(--f-mono);font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;z-index:10;}
.d-close > span:not(.sess-timer){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.d-body{flex:1;padding:18px 18px 0;max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;}
.d-title{font-size:2rem;}
.d-focus{font-size:0.95rem;color:var(--text2);margin-top:8px;line-height:1.55;}
.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:12px;}
.acc > summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;cursor:pointer;font-weight:700;font-size:0.95rem;color:var(--text);}
.acc > summary::-webkit-details-marker{display:none;}
.acc > summary .acc-meta{margin-left:auto;font-family:var(--f-mono);font-size:0.76rem;font-weight:600;color:var(--muted);}
.acc > summary .ico{width:16px;height:16px;color:var(--muted);transition:transform .15s;}
.acc[open] > summary .ico{transform:rotate(180deg);}
.acc-body{padding:0 16px 12px;}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 0;border:0;border-top:1px solid var(--border);background:none;text-align:left;cursor:pointer;}
.acc-body > .item:first-child{border-top:0;}
div.item{cursor:default;}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;margin-top:1px;}
.check.on{background:var(--accent);border-color:var(--accent);}
.check.on::after{content:'';width:10px;height:5px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg);}
.item-text{flex:1;font-size:0.92rem;line-height:1.55;color:var(--text2);}
.item.std .item-text{font-weight:600;color:var(--text);}
.d-gap{flex:none;height:20px;}
.d-foot{position:sticky;bottom:0;z-index:5;margin:auto -18px 0;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);background:var(--surface);border-top:1px solid var(--border);}
.master-btn{width:100%;min-height:52px;border-radius:14px;border:none;font-size:0.95rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;text-align:center;}
.master-btn.ready{background:var(--accent);color:var(--on-accent);}
.master-btn.ready:hover{background:var(--accent-hover);}
.master-btn.notready{background:var(--surface2);color:var(--muted);border:1px solid var(--border);cursor:not-allowed;}
.master-btn.done{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);cursor:default;}
.master-btn .ico{width:18px;height:18px;stroke-width:2.6;}
.gate-hint{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:8px;}
.foot-links{display:flex;justify-content:center;gap:16px;margin-top:6px;}
.foot-link{background:none;border:0;color:var(--muted);font-size:0.8rem;text-decoration:underline;cursor:pointer;min-height:32px;}
.sess-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.sess-steps i{height:5px;border-radius:3px;background:var(--track);}
.sess-steps i.on{background:var(--accent);}
.sess-steps i.done{background:var(--accent-line);}
.sess-timer{flex:none;font-family:var(--f-mono);font-weight:600;font-size:0.82rem;letter-spacing:0;text-transform:none;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:6px 12px;}
.sess-timer.up{color:var(--amber);background:var(--amber-bg);}
ul.tips{list-style:none;}
ul.tips li{font-size:0.9rem;line-height:1.55;color:var(--text2);padding:8px 0 8px 18px;position:relative;border-top:1px solid var(--border);}

ul.tips li::before{content:'›';position:absolute;left:2px;top:7px;color:var(--accent);font-weight:800;}
/* practice panel: shapes, strum, play-along + tempo ladder */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-top:12px;}
.pcard-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-height:34px;}
.pcard-h .seg{text-transform:none;letter-spacing:0;font-family:'Plus Jakarta Sans',sans-serif;}
.pnote{font-size:0.82rem;color:var(--text2);margin-top:8px;line-height:1.45;}
.chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px;margin-top:8px;}
.chord-box{display:flex;flex-direction:column;align-items:center;padding:4px 2px;}
.chord-box .cname{font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--text);}
.chord-box svg{width:66px;height:82px;display:block;}
.chord-box .csub{font-family:var(--f-mono);font-size:0.62rem;color:var(--muted);text-align:center;line-height:1.3;}
.cd-grid{stroke:var(--border2);}
.cd-nut{fill:var(--text);}
.cd-fr{fill:var(--muted);}
.cd-dot{fill:var(--accent);}
.cd-open{stroke:var(--accent);}
.cd-mute{fill:var(--red);}
.ss{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));border:1px solid var(--border2);border-radius:10px;overflow:hidden;margin-top:10px;max-width:420px;}
.ss-slot{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:46px;padding:6px 0 4px;border-left:1px solid var(--surface2);}
.ss-slot.beat{border-left-color:var(--border2);}
.ss-slot:first-child{border-left:0;}
.ss-g{font-size:1.05rem;font-weight:800;line-height:1;height:17px;}
.ss-g.dn{color:var(--text);}
.ss-g.up{color:var(--muted);}
.ss-g.mut{color:var(--red);}
.ss-g.roll{color:var(--accent);}
.ss-b{font-family:var(--f-mono);font-size:0.6rem;color:var(--muted);}
.tempo-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px;}
.tempo-big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:0.9;letter-spacing:-0.02em;color:var(--text);}
.tempo-big span{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.95rem;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0;}
.tempo-note{font-size:0.82rem;color:var(--text2);text-align:right;line-height:1.35;}
.ladder{position:relative;display:flex;justify-content:space-between;margin-top:16px;}
.ladder::before{content:'';position:absolute;left:17px;right:17px;top:10px;height:2px;background:var(--track);}
.ladder .lfill{position:absolute;left:17px;top:10px;height:2px;background:var(--accent);}
.rung{position:relative;width:34px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.rung .dotw{height:22px;display:flex;align-items:center;justify-content:center;}
.rung .d{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--border2);}
.rung.done .d{background:var(--accent);border-color:var(--accent);}
.rung.now .d{width:22px;height:22px;background:var(--accent-bg);border:3px solid var(--accent);}
.rung.goal .d{border-color:var(--text2);}
.rung .lb{font-family:var(--f-mono);font-size:0.72rem;font-weight:500;color:var(--muted);white-space:nowrap;}
.rung.done .lb,.rung.goal .lb{color:var(--text);}
.rung.now .lb{color:var(--accent);font-weight:600;}
.prow{display:flex;gap:8px;margin-top:14px;}
.pbtn{flex:1;min-height:48px;border-radius:13px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:0.92rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 12px;}
.pbtn:hover{background:var(--accent-hover);}
.pbtn .ico{width:17px;height:17px;}
.step-btn{width:100%;min-height:48px;margin-top:10px;border-radius:13px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:700;font-size:0.9rem;cursor:pointer;padding:0 12px;}
/* barre gym */
.gym-cur{display:flex;gap:12px;align-items:center;margin-top:8px;}
.gym-cur .chord-box{flex:none;width:86px;}
.gym-txt{flex:1;min-width:0;font-size:0.86rem;color:var(--text2);line-height:1.5;}
.gym-txt b{color:var(--text);}
.gym-q{font-size:0.88rem;font-weight:700;color:var(--text);margin-top:14px;}
.nums{display:grid;gap:6px;margin-top:8px;}
.gnum{min-height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--f-mono);font-size:0.95rem;font-weight:600;cursor:pointer;}
.gnum[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
/* progress rows, stat tiles, calendar */
.mrow{display:grid;grid-template-columns:108px minmax(0,1fr) 34px 70px;align-items:center;gap:10px;min-height:42px;border-top:1px solid var(--border);}
.mrow.g{grid-template-columns:52px minmax(0,1fr) 36px 82px;}
.card-eyebrow + .mrow{margin-top:10px;}
.mrow-n{font-size:0.88rem;font-weight:600;color:var(--text);}
.mrow.g .mrow-n{font-family:var(--f-display);font-weight:800;}
.mrow-v{font-family:var(--f-mono);font-size:0.8rem;font-weight:600;color:var(--text);text-align:right;}
.mrow-s{font-size:0.76rem;text-align:right;color:var(--muted);}
.mrow-s.ok{color:var(--accent);font-weight:700;}
.mrow-s.on{color:var(--text2);font-weight:700;}
.meter{display:block;height:8px;border-radius:4px;background:var(--accent-bg);overflow:hidden;}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent);}
.mini-tog{justify-self:end;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:0.74rem;font-weight:600;cursor:pointer;}
.mini-tog[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line);}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;}
.kpi-v{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-0.02em;color:var(--text);}
.kpi-v span{font-size:1rem;font-weight:700;color:var(--muted);}
.kpi-l{font-family:var(--f-mono);font-size:0.66rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;}
.cal{display:flex;gap:6px;margin-top:12px;}
.cal-days{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:4px;width:12px;font-family:var(--f-mono);font-size:0.6rem;color:var(--muted);}
.cal-days span{display:flex;align-items:center;}
.cal-grid{flex:1;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;}
.cal-c{aspect-ratio:1;border-radius:4px;background:var(--track);}
.cal-c.on{background:var(--accent);}
.cal-c.fut{background:none;}
.cal-c.now{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent-line);}
.cal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:0.8rem;color:var(--text2);}
.cal-key{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:0.75rem;}
.cal-key .cal-c{display:inline-block;width:10px;height:10px;margin-left:6px;}
/* reference */
.road-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border);}
.card-eyebrow + .road-row{margin-top:10px;border-top:0;}
.road-tag{flex:none;min-width:78px;font-family:var(--f-mono);font-size:0.66rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;text-align:center;background:var(--accent-bg);color:var(--accent);}
.road-tag.c{background:var(--purple-bg);color:var(--purple);}
.road-tag.peak{background:var(--red-bg);color:var(--red);}
.road-body{font-size:0.86rem;color:var(--text2);line-height:1.45;}
.road-body b{color:var(--text);font-family:var(--f-mono);font-weight:500;}
.strum-item{padding:12px 0;border-top:1px solid var(--border);}
.card-eyebrow + .strum-item{margin-top:6px;border-top:0;}
.strum-hd{font-size:0.86rem;}
.strum-hd b{color:var(--text);}
.strum-hd span{color:var(--muted);font-size:0.8rem;}
/* logs + checkpoint */
.log-form{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
.log-row{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
.log-min{width:84px;min-height:44px;border:1px solid var(--border2);border-radius:10px;padding:0 11px;font:inherit;font-size:0.92rem;background:var(--surface);color:var(--text);-webkit-appearance:none;}
.log-min-label{font-size:0.82rem;color:var(--muted);font-weight:600;}
.log-note,.notes{width:100%;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;font:inherit;font-size:0.9rem;background:var(--surface);color:var(--text);resize:vertical;min-height:64px;line-height:1.5;-webkit-appearance:none;}
.log-min:focus,.log-note:focus,.notes:focus{outline:2px solid var(--accent-line);border-color:var(--accent);}
.log-add{width:100%;min-height:46px;margin-top:9px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:0.88rem;cursor:pointer;}
.log-rollup{font-family:var(--f-mono);font-size:0.7rem;font-weight:600;color:var(--muted);margin-bottom:9px;text-transform:uppercase;letter-spacing:0.04em;}
.log-list{display:flex;flex-direction:column;gap:8px;}
.log-entry{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.log-head{display:flex;align-items:center;gap:8px;}
.log-date{font-size:0.8rem;font-weight:700;color:var(--text);}
.log-meta{font-size:0.68rem;color:var(--amber);font-weight:700;font-family:var(--f-mono);}
.log-del{margin-left:auto;width:32px;height:32px;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.log-del .ico{width:16px;height:16px;}
.log-body{font-size:0.86rem;color:var(--text2);line-height:1.5;margin-top:6px;white-space:pre-wrap;}
.log-empty{font-size:0.82rem;color:var(--muted);padding:4px 0;}
.cp-note{background:var(--purple-bg);border:1px solid var(--purple-line);border-radius:var(--radius);padding:12px 14px;font-size:0.86rem;line-height:1.55;color:var(--text2);margin-top:12px;}
.cp-note b{color:var(--purple);}
/* full-screen player (SheetPlayer mounts inline here) */
.player-modal{display:none;position:fixed;inset:0;z-index:940;background:var(--bg);flex-direction:column;}
.player-modal.open{display:flex;}
.player-head{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);}
.ph-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ph-title b{font-size:0.98rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph-title span{font-family:var(--f-mono);font-size:0.7rem;font-weight:600;color:var(--muted);}
#playerBody{flex:1;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* metronome sheet */
.metro-panel{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);z-index:930;max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:14px 16px 16px;}
.metro-panel.open{display:block;}
.metro-row{display:flex;align-items:center;gap:10px;}
.metro-bpm-big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--text);}
.metro-bpm-big em{font-style:normal;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;color:var(--muted);margin-left:4px;}
.metro-beats{display:flex;gap:8px;margin-left:auto;}
.metro-dot{width:14px;height:14px;border-radius:50%;background:var(--track);}
.metro-dot.accent{box-shadow:inset 0 0 0 2px var(--accent-line);}
.metro-dot.beat{background:var(--accent);}
.metro-slider{flex:1;accent-color:var(--accent);}
.metro-btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-weight:700;font-size:0.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.metro-btn.sm{width:44px;padding:0;font-size:1.2rem;}
.metro-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.metro-btn.grow{flex:1;}
.metro-btn .ico{width:17px;height:17px;}
.metro-pill{display:none;position:fixed;right:14px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);z-index:820;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:0.84rem;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);}
.metro-pill.on{display:inline-flex;}
.metro-pill .ico{width:17px;height:17px;}
@media(min-width:769px){.tabbar{max-width:760px;margin:0 auto;border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;}}

<script id="theme-boot">
/* Sets light/dark before first paint. Preference lives in its own key (not the backup): auto | light | dark */
(function(){var p='auto';try{p=localStorage.getItem('ruyan_theme')||'auto';}catch(e){}
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function apply(){var d=p==='dark'||(p==='auto'&&!!mq&&mq.matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#111514':'#ECEEEA');}
apply();if(mq){var f=function(){if(p==='auto')apply();};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f);}
window.__setTheme=function(v){p=v;try{localStorage.setItem('ruyan_theme',v);}catch(e){}apply();};
window.__getTheme=function(){return p;};})();
</script>

<script>
/* ===================== THE PATH — song first, barres alongside =====================
   Lesson ids are the progress keys: never change or reuse one. Lessons carried over from the
   old barre-first path keep their ids (3.1, 4.1, …); new ones have new ids (s.1, pc.1, b.1).

const FLAT=[];STAGES.forEach(m=>m.lessons.forEach(l=>FLAT.push(l.id)));
/* The barre gym runs alongside the path. `of` = strings that must ring. */
const GYM=[
 {c:'F#m',of:6,tip:'Index flat across all six strings at fret 2; ring and pinky on the A and D strings at fret 4, middle on G at fret 3.'},
 {c:'Bm',of:5,tip:'Index across five strings at fret 2 (low E muted); middle on B at fret 3, ring and pinky on D and G at fret 4.'},
 {c:'C#m',of:5,tip:'The Bm shape slid up to fret 4. Low E muted.'},
 {c:'F',of:6,tip:'Index across all six at fret 1 — the hardest one. Get the top four strings ringing first, then add the bass.'}
];
/* The song's parts for the song map; each is measured by the lesson that teaches it. */
const PARTS=[{n:'Intro',id:'3.3',w:2},{n:'Verse',id:'4.1',w:6},{n:'Pre-chorus',id:'pc.1',w:5},{n:'Chorus',id:'5.1',w:6},{n:'Bridge',id:'6.2',w:3},{n:'Final choruses',id:'7.1',w:9},{n:'Outro',id:'8.1',w:3}];
const SONG_BPM=76;
const STARTER={'Bm':'Bm7','F#m':'F#m7','C#m':'C#m7','F':'Fmaj7'};
const STARTER_OF={'F#m7':'F#m','C#m7':'C#m','Fmaj7':'F'};

/* ===================== STATE =====================
   S = per-lesson state (localStorage ruyan_lessons_v1, unchanged format).
   M = meta (ruyan_meta_v1): days (practice dates), tempo (rung per lesson), gym (per-barre log + in-song flag). */
let OK=false,S={},M={};
const KEY='ruyan_lessons_v1',MKEY='ruyan_meta_v1';
function init(){
 try{localStorage.setItem('_t','1');localStorage.removeItem('_t');OK=true;}catch(e){OK=false;document.getElementById('sb').style.display='block';}
 if(OK){try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){S={};}try{M=JSON.parse(localStorage.getItem(MKEY)||'{}')||{};}catch(e){M={};}}
 Object.keys(S).forEach(id=>{const o=S[id];if(!o)return;if(!Array.isArray(o.logs))o.logs=[];if(o.notes&&o.notes.trim()&&o.logs.length===0){o.logs.unshift({ts:Date.now(),min:null,note:o.notes.trim(),migrated:true});o.notes='';}});
 normMeta();migrate();persist();
}
function normMeta(){
 if(!M||typeof M!=='object')M={};
 if(!Array.isArray(M.days))M.days=[];
 if(!M.tempo||typeof M.tempo!=='object')M.tempo={};
 if(!M.gym||typeof M.gym!=='object')M.gym={};
 GYM.forEach(g=>{const o=M.gym[g.c]||(M.gym[g.c]={});if(!Array.isArray(o.hist))o.hist=[];o.up=!!o.up;});
}
/* One-time move from the old barre-first path: barres already passed in its Module 1 go straight
   into the song, and every logged session becomes a practice day. */
function migrate(){
 if(M.v2)return;
 if(isMastered('1.2'))M.gym['F#m'].up=true;
 if(isMastered('1.3'))M.gym['Bm'].up=true;
 if(isMastered('1.4'))M.gym['C#m'].up=true;
 const set=new Set(M.days);
 Object.keys(S).forEach(id=>{(S[id]&&S[id].logs||[]).forEach(e=>{if(e&&e.ts)set.add(dstr(new Date(e.ts)));});});
 M.days=[...set].sort().slice(-400);
 M.v2=1;
}
function persist(){if(!OK)return;try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(MKEY,JSON.stringify(M));}catch(e){}}
function st(id){if(!S[id])S[id]={mastered:false,tasks:{},stds:{},notes:'',recorded:false,review:'',logs:[]};const o=S[id];if(!Array.isArray(o.logs))o.logs=[];if(!o.tasks)o.tasks={};if(!o.stds)o.stds={};return o;}
function isMastered(id){return !!(S[id]&&S[id].mastered);}
function statusOf(id){if(isMastered(id))return 'mastered';const i=FLAT.indexOf(id);if(i<=0)return 'available';return isMastered(FLAT[i-1])?'available':'locked';}
function lessonById(id){for(const m of STAGES)for(const l of m.lessons)if(l.id===id)return l;return null;}
function stageOf(id){return STAGES.find(m=>m.lessons.some(l=>l.id===id))||null;}
function lessonNo(id){const m=stageOf(id);return m.n+'.'+(m.lessons.findIndex(l=>l.id===id)+1);}
function nextLessonId(){return FLAT.find(id=>!isMastered(id))||null;}
function stageState(m){const tot=m.lessons.length,done=m.lessons.filter(l=>isMastered(l.id)).length;const nx=nextLessonId();const cur=nx?stageOf(nx):null;
 let state='open';if(done===tot)state='done';else if(cur===m)state='current';else if(statusOf(m.lessons[0].id)==='locked'&&done===0)state='locked';return {tot,done,state};}

/* ---- practice days: ANY practice path must call markDay(), or that practice won't count ---- */
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dstr(new Date());}
function markDay(){const t=todayStr();if(!M.days.includes(t)){M.days.push(t);M.days.sort();if(M.days.length>400)M.days=M.days.slice(-400);}persist();}
function didToday(){return M.days.includes(todayStr());}
/* Streak through today, or through yesterday if today isn't practised yet; 0 once a day is missed. */
function curStreak(){const set=new Set(M.days);const d=new Date();d.setHours(12,0,0,0);if(!set.has(dstr(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dstr(d))){n++;d.setDate(d.getDate()-1);}return n;}
function bestStreak(){const ds=[...new Set(M.days)].sort();let best=0,run=0,prev=null;ds.forEach(k=>{const t=new Date(k+'T12:00:00');run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;if(run>best)best=run;prev=t;});return best;}
function whenStr(k){const a=new Date(k+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);const n=Math.round((b-a)/864e5);return n<=0?'today':(n===1?'yesterday':n+'d ago');}

/* ---- song sections ---- */
function secIdx(name){const L=RUYAN_SONG.sections;let i=L.findIndex(s=>s.name===name);if(i<0)i=L.findIndex(s=>s.name.indexOf(name)>=0);return i;}
function secRange(sec){const a=Math.max(0,secIdx(sec.from));const b=sec.to?secIdx(sec.to):a;return [a,Math.max(a,b)];}
function secLabel(i){return RUYAN_SONG.sections[i].name.replace(/\s*\([^)]*\)\s*/g,' ').trim();}
function strumOf(l){if(l.strum===null)return null;if(l.strum)return l.strum;if(!l.sec)return null;const s=RUYAN_SONG.sections[secRange(l.sec)[0]];return s.strum||(/Intro|间奏/.test(s.name)?'muted':'ballad');}

/* ---- tempo ladder ---- */
function rungs(l){const r=[];for(let b=l.bpm[0];b<l.bpm[1];b+=4)r.push(b);r.push(l.bpm[1]);return r;}
function tempoOf(l){if(!l.bpm)return null;if(isMastered(l.id))return l.bpm[1];const t=M.tempo[l.id];return t==null?l.bpm[0]:t;}
function started(l){return isMastered(l.id)||M.tempo[l.id]!=null;}
function stepUp(id){const l=lessonById(id),r=rungs(l),i=r.indexOf(tempoOf(l));const nx=r[Math.min(r.length-1,(i<0?0:i)+1)];M.tempo[id]=nx;markDay();showToast('Up to '+nx+' bpm');repaint();}
function stepDown(id){const l=lessonById(id),r=rungs(l),i=r.indexOf(tempoOf(l));M.tempo[id]=r[Math.max(0,i-1)];persist();repaint();}
function cleanAtGoal(id){const l=lessonById(id),s=st(id);M.tempo[id]=l.bpm[1];s.stds[0]=true;markDay();
 if(l.stds.every((_,i)=>s.stds[i]))masterLesson(id);else{persist();showToast('Clean at '+l.bpm[1]+' — tick the other standard to finish');repaint();}}
function masterLesson(id){const l=lessonById(id),s=st(id);s.mastered=true;if(l.bpm)M.tempo[id]=l.bpm[1];markDay();persist();showToast((l.cp?'Final take passed':'Mastered')+' — next unlocked');repaint();}

/* ---- shapes: starter (no barre) until the gym puts a barre into the song ---- */
let shapeView='play';
function inSong(c){return !!(M.gym[c]&&M.gym[c].up);}
function playShape(n){if(STARTER[n])return inSong(n)?n:STARTER[n];if(STARTER_OF[n]&&inSong(STARTER_OF[n]))return STARTER_OF[n];return n;}
function lessonChords(l){const names=[];let fromSong=false;
 if(l.chords)l.chords.forEach(n=>names.push(n));
 else if(l.sec){fromSong=true;const r=secRange(l.sec);for(let i=r[0];i<=r[1];i++)RUYAN_SONG.sections[i].chords.forEach(c=>names.push(c[0]));}
 const out=[];names.forEach(n=>{const s=shapeView==='full'?(fromSong?n:(STARTER_OF[n]||n)):playShape(n);if(!out.includes(s))out.push(s);});return out;}
function setShapeView(v){shapeView=v;repaint();}
function chordBox(n){const c=RUYAN_CHORDS[n];return '<div class="chord-box"><div class="cname">'+n+'</div>'+chordDiagramSVG(n)+'<div class="csub">'+(c?c.sub:'')+'</div></div>';}

/* ---- play-from-the-top: the longest run of song sections, from the intro, that you've started ---- */
function learntUpTo(){const n=RUYAN_SONG.sections.length,cov=new Array(n).fill(false);
 FLAT.forEach(id=>{const l=lessonById(id);if(!l.sec||/^9\./.test(id)||!started(l))return;const r=secRange(l.sec);for(let i=r[0];i<=r[1];i++)cov[i]=true;});
 let e=-1;while(e+1<n&&cov[e+1])e++;return e;}
function topRange(){const e=learntUpTo();return {to:Math.max(0,e),none:e<0};}
function topLabel(){const r=topRange();return r.none?'the intro':secLabel(0)+(r.to>0?' → '+secLabel(r.to):'');}
function topTempo(){const e=learntUpTo();let t=null;FLAT.forEach(id=>{const l=lessonById(id);if(!l.bpm||!l.sec||/^9\./.test(id)||!started(l))return;if(secRange(l.sec)[0]<=e){const v=tempoOf(l);t=t==null?v:Math.min(t,v);}});return t||60;}

/* ---- the band (SheetPlayer mounted inline — a click here is a real gesture, so audio starts) ---- */
function anyOverlay(){return ['detail','sess','playerModal'].some(i=>document.getElementById(i).classList.contains('open'));}
function openPlayer(opts,title,sub){document.getElementById('playerTitle').textContent=title;document.getElementById('playerSub').textContent=sub||'';
 document.getElementById('playerModal').classList.add('open');document.body.style.overflow='hidden';
 SheetPlayer.mount(document.getElementById('playerBody'),{embed:true});SheetPlayer.play(Object.assign({autoplay:1},opts));}
function closePlayer(){document.getElementById('playerModal').classList.remove('open');if(window.SheetPlayer)SheetPlayer.unmount();if(!anyOverlay())document.body.style.overflow='';}
function playAlong(id){const l=lessonById(id);if(l.bpm&&M.tempo[id]==null)M.tempo[id]=l.bpm[0];markDay();
 if(l.sec){const r=secRange(l.sec),L=RUYAN_SONG.sections,bpm=l.bpm?tempoOf(l):SONG_BPM;
  openPlayer({section:L[r[0]].name,to:L[r[1]].name,bpm:bpm,chordsOnly:l.melody?0:1,loop:1},l.t,bpm+' bpm · '+(l.melody?'with the melody':'chords only')+' · loop');}
 else Metro.start(l.bpm?tempoOf(l):(l.click||60));
 repaint();}
function playTop(){const r=topRange(),L=RUYAN_SONG.sections,bpm=topTempo();markDay();openPlayer({section:L[0].name,to:L[r.to].name,bpm:bpm},'Play from the top',topLabel()+' · '+bpm+' bpm');repaint();}
function playWhole(){const L=RUYAN_SONG.sections;markDay();openPlayer({section:L[0].name,to:L[L.length-1].name,bpm:SONG_BPM},'如烟 — the whole song','76 bpm · melody and chords');}

/* ---- barre gym ---- */
function gymCur(){return GYM.find(g=>!inSong(g.c))||null;}
function gymLast(c){const h=M.gym[c].hist;return h.length?h[h.length-1]:null;}
function gymPick(){const g=gymCur();if(g)return g;return GYM.slice().sort((a,b)=>{const x=gymLast(a.c),y=gymLast(b.c);return (x?x.d:'')<(y?y.d:'')?-1:1;})[0];}
function gymToday(c){const e=M.gym[c].hist.find(x=>x.d===todayStr());return e?e.ok:null;}
function logGym(c,n){const g=GYM.find(x=>x.c===c),h=M.gym[c].hist,t=todayStr();const e=h.find(x=>x.d===t);if(e)e.ok=n;else h.push({d:t,ok:n});
 h.sort((a,b)=>a.d<b.d?-1:1);if(h.length>60)h.splice(0,h.length-60);markDay();
 const last3=h.slice(-3);
 if(!M.gym[c].up&&last3.length===3&&last3.every(x=>x.ok>=g.of)){M.gym[c].up=true;persist();showToast(c+' rang clean three days in a row — the full barre is in the song now');}
 else showToast(c+': '+n+' of '+g.of+' strings');
 repaint();}
function setInSong(c,v){M.gym[c].up=!!v;persist();showToast(v?c+' barre is in the song':c+' back to the starter shape');repaint();}
function gymPanel(){const g=gymPick(),today=gymToday(g.c);let nums='';for(let i=0;i<=g.of;i++)nums+='<button class="gnum" aria-pressed="'+(today===i)+'" onclick="logGym(\''+g.c+'\','+i+')">'+i+'</button>';
 return (gymCur()?'':'<p class="pnote" style="margin-top:0">All four barres are in the song. Keeping '+g.c+' warm today.</p>')+
  '<div class="gym-cur">'+chordBox(g.c)+'<div class="gym-txt">'+g.tip+'<br><b>Press for 4 counts, release — ×5.</b> Then strum once, slowly.</div></div>'+
  '<div class="gym-q">How many strings rang clean?</div><div class="nums" style="grid-template-columns:repeat('+(g.of+1)+',minmax(0,1fr))">'+nums+'</div>';}

 const ds=PARTS.filter((p,i)=>ps[i].s==='done').map(p=>p.n),ls=PARTS.map((p,i)=>({p:p,x:ps[i]})).filter(o=>o.x.s==='learn');

let pathOpen=null;
function togglePath(n){const cur=nextLessonId()?stageOf(nextLessonId()).n:-1;const openN=pathOpen==null?cur:pathOpen;pathOpen=(openN===n)?-1:n;render();}
function rmNode(ss,n){
 if(ss.state==='done')return '<span class="rm-node done">'+ico('check')+'</span>';

 const ic=s==='mastered'?'<span class="ls-ic done">'+ico('check')+'</span>':(l.cp?'<span class="ls-ic cp"></span>':(isNext?'<span class="ls-ic next"></span>':(s==='locked'?'<span class="ls-ic lock">'+ico('lock')+'</span>':'<span class="ls-ic todo"></span>')));

 const doneSt=STAGES.filter(m=>stageState(m).state==='done').length,dl=FLAT.filter(isMastered).length;
 let firstLocked=null;STAGES.forEach(m=>{if(firstLocked==null&&stageState(m).state==='locked')firstLocked=m.n;});
 let h='<div class="page-head"><h1 class="display">Your path</h1><span class="page-count">'+doneSt+' / '+STAGES.length+' stages</span></div><div class="pbar"><i style="width:'+Math.round(dl/FLAT.length*100)+'%"></i></div><p class="page-sub">Song first. Barres level up alongside.</p><div class="road-list">';
 STAGES.forEach(m=>{const ss=stageState(m),open=openN===m.n;

   (m.n===firstLocked?'<button class="pill-btn" onclick="testOut('+m.n+')">Test out</button>':'')+'</div>';

 h+='</div>';

 m.lessons.forEach(l=>{const s=st(l.id);s.mastered=true;l.stds.forEach((_,i)=>{s.stds[i]=true;});if(l.bpm)M.tempo[l.id]=l.bpm[1];});

 for(let i=0;i<84;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dstr(d),fut=d>today,on=!fut&&days.has(k);if(on)n++;

const STRUM_INFO={
 muted:{label:'Muted groove',use:'Intro & 间奏 — open A rings, then muted chicks'},
 ballad:{label:'16th gallop',use:'Verses & choruses — the main driving pattern'},

function strumStrip(name){const P=(window.RUYAN_STRUM||{})[name];if(!P)return '';const by={};P.forEach(s=>{by[Math.round(s.p*4)]=s;});let cells='';
 for(let i=0;i<16;i++){const s=by[i],beat=i%4===0;let g='',cls='';if(s){if(s.r){g='↓';cls='roll';}else if(s.m){g='×';cls='mut';}else if(s.d==='D'){g='↓';cls='dn';}else{g='↑';cls='up';}}
  cells+='<div class="ss-slot'+(beat?' beat':'')+'"><span class="ss-g '+cls+'">'+g+'</span><span class="ss-b">'+(beat?(i/4+1):'')+'</span></div>';}
 return '<div class="ss" role="img" aria-label="'+((STRUM_INFO[name]||{}).label||name)+' strum pattern, one bar">'+cells+'</div>';}
function renderRef(){
 const C=Object.keys(window.RUYAN_CHORDS||{});
 const chordsWhere=pred=>{const seen=[];RUYAN_SONG.sections.forEach((s,i)=>{if(pred(s,i))s.chords.forEach(c=>{const n=playShape(c[0]);if(!seen.includes(n))seen.push(n);});});return seen;};
 const road=[
  {t:'Intro',c:'',d:'Key A. Muted strum groove on one open chord.',p:s=>/Intro|间奏/.test(s.name)},
  {t:'Verses',c:'',d:'Key A, the 16th gallop with the melody on top.',p:s=>/Verse/.test(s.name)},
  {t:'Choruses',c:'',d:'Key A, driving strum, three minor shapes in a row.',p:s=>/Pre-chorus|Chorus 1|Chorus 2/.test(s.name)},
  {t:'Bridge',c:'c',d:'Lifts up to C — 转1=C调.',p:s=>s.key==='C'},
  {t:'Return',c:'c',d:'Back down to A — 转1=A调 — into the final choruses.',p:null},
  {t:'Finals',c:'',d:'Key A choruses, escalating.',p:s=>/Chorus 3|Chorus 4/.test(s.name)},
  {t:'Outro',c:'peak',d:'Palm-muted build, then a slow roll that fades out.',p:s=>/Outro|告别|如烟/.test(s.name)}
 ];
 (function(){const have=new Set(C);const used=new Set();RUYAN_SONG.sections.forEach(s=>s.chords.forEach(c=>used.add(c[0])));const miss=[...used].filter(n=>!have.has(n));if(miss.length)console.warn('[Mastery Path] song uses chords with no diagram:',miss.join(', '));})();
 const starter=['A','D','E','G','Am','Bm7','F#m7','C#m7','Fmaj7'],barres=['F#m','Bm','C#m','F'];
 return '<div class="page-head"><h1 class="display">Reference</h1></div><p class="page-sub">The 王一编配 arrangement, key of A, no capo. You play it on starter shapes first; each barre swaps in from the gym.</p>'+
 '<section class="card"><div class="card-eyebrow"><span>Starter shapes</span><span>no barres</span></div><div class="chord-grid">'+starter.map(chordBox).join('')+'</div><p class="card-foot">The whole song with these. Bm7, F#m7, C#m7 and Fmaj7 stand in for the barre chords — same chords, a shade softer.</p></section>'+
 '<section class="card"><div class="card-eyebrow"><span>Full barres</span><span>from the gym</span></div><div class="chord-grid">'+barres.map(chordBox).join('')+'</div></section>'+
 '<section class="card"><div class="card-eyebrow"><span>Road map</span><span>A → C → A</span></div>'+road.map(r=>{const ch=r.p?chordsWhere(r.p):[];return '<div class="road-row"><span class="road-tag '+r.c+'">'+r.t+'</span><span class="road-body">'+r.d+(ch.length?' <b>'+ch.join(' · ')+'</b>':'')+'</span></div>';}).join('')+'</section>'+
 '<section class="card"><div class="card-eyebrow"><span>Strum patterns</span><span>one bar</span></div>'+['muted','ballad','soft','chop','ring'].map(pn=>{const i=STRUM_INFO[pn];return '<div class="strum-item"><div class="strum-hd"><b>'+i.label+'</b> <span>'+i.use+'</span></div>'+strumStrip(pn)+'</div>';}).join('')+'<p class="card-foot">↓ down · ↑ up · × muted chick · numbers are beats</p></section>';}

/* ===================== LESSON SCREEN ===================== */
const ACCO={};
function acc(key,title,meta,body){return '<details class="acc"'+(ACCO[key]?' open':'')+' ontoggle="ACCO[\''+key+'\']=this.open"><summary>'+title+'<span class="acc-meta">'+meta+'</span>'+ico('chevd')+'</summary><div class="acc-body">'+body+'</div></details>';}
function itemHTML(on,fn,text,cls){return '<button class="item'+(cls?' '+cls:'')+'" onclick="'+fn+'" aria-pressed="'+!!on+'"><span class="check'+(on?' on':'')+'"></span><span class="item-text">'+text+'</span></button>';}
function ladderBtn(l,cls){const t=tempoOf(l),r=rungs(l),i=r.indexOf(t),g=l.bpm[1];
 if(t<g){const nx=r[Math.min(r.length-1,(i<0?0:i)+1)];return '<button class="'+cls+'" onclick="stepUp(\''+l.id+'\')">Clean twice at '+t+' — step up to '+nx+'</button>';}
 return '<button class="'+cls+'" onclick="cleanAtGoal(\''+l.id+'\')">Clean twice at '+g+(g===SONG_BPM?' — that’s the song':' — done')+'</button>';}
function playCard(l,inSes){
 let h='<div class="pcard"><div class="pcard-h"><span>'+(l.sec?'Play along':'With the click')+'</span>'+(l.sec?'<span>'+(l.melody?'melody on':'chords only')+'</span>':'')+'</div>';
 if(l.bpm){const t=tempoOf(l),g=l.bpm[1],r=rungs(l);
  h+='<div class="tempo-row"><div class="tempo-big">'+t+'<span>bpm</span></div><div class="tempo-note">'+(g===SONG_BPM?'The song itself<br>is 76 bpm':'Goal: '+g+' bpm')+'</div></div>';
  if(r.length>1){const i=Math.max(0,r.indexOf(t));
   h+='<div class="ladder" role="img" aria-label="Tempo ladder: now '+t+', goal '+g+' bpm"><span class="lfill" style="width:calc((100% - 34px) * '+(i/(r.length-1)).toFixed(3)+')"></span>'+
    r.map((b,k)=>'<span class="rung '+(isMastered(l.id)||k<i?'done':(k===i?'now':(k===r.length-1?'goal':'')))+'"><span class="dotw"><span class="d"></span></span><span class="lb">'+b+(k===r.length-1&&g===SONG_BPM?' song':'')+'</span></span>').join('')+'</div>';}}
 h+='<div class="prow"><button class="pbtn" onclick="playAlong(\''+l.id+'\')">'+ico('play')+(l.sec?(l.melody?'Play with the melody':'Loop with the band'):'Click at '+(l.bpm?tempoOf(l):(l.click||60)))+'</button></div>';
 if(inSes&&l.bpm&&!isMastered(l.id))h+=ladderBtn(l,'step-btn');
 return h+'</div>';}
function practicePanel(l,inSes){let h='';const ch=(l.chords||l.sec)?lessonChords(l):[];
 if(ch.length){const upAny=GYM.some(g=>inSong(g.c));
  const sv=shapeView;shapeView=sv==='full'?'play':'full';const other=lessonChords(l);shapeView=sv;const differs=other.join()!==ch.join();
  h+='<div class="pcard"><div class="pcard-h"><span>The shapes</span>'+(differs?'<div class="seg sm" role="group" aria-label="Chord shapes"><button class="seg-b" aria-pressed="'+(shapeView==='play')+'" onclick="setShapeView(\'play\')">'+(upAny?'Yours':'Starter')+'</button><button class="seg-b" aria-pressed="'+(shapeView==='full')+'" onclick="setShapeView(\'full\')">Full barre</button></div>':'')+'</div>'+
   '<div class="chord-grid">'+ch.map(chordBox).join('')+'</div>'+
   '<p class="pnote">'+(differs&&shapeView==='full'?'The 王一 tab’s barre shapes. The Barre gym swaps each one in when it rings.':(ch.some(c=>/^(F#m7|C#m7|Fmaj7)$/.test(c))?'No barres — the m7 and maj7 shapes stand in for the barre chords. Same chords, a shade softer.':'Open shapes — let every string ring.'))+'</p></div>';}
 const sp=strumOf(l);
 if(sp)h+='<div class="pcard"><div class="pcard-h"><span>Strum · '+(STRUM_INFO[sp]?STRUM_INFO[sp].label:sp)+'</span><span>↓ down · ↑ up</span></div>'+strumStrip(sp)+'</div>';
 if(l.sec||l.bpm||l.click)h+=playCard(l,inSes);
 return h;}
function footHTML(l,s){
 if(s.mastered)return '<button class="master-btn done" disabled>'+ico('check')+(l.cp?'Final take passed':'Mastered')+'</button><div class="foot-links"><button class="foot-link" onclick="unmark()">Un-mark this</button></div>';
 if(l.bpm){const t=tempoOf(l),r=rungs(l);let x=ladderBtn(l,'master-btn ready')+'<div class="gate-hint">'+(l.bpm[1]===SONG_BPM?'Mastered at 76 — the song’s own tempo':'Mastered when it’s clean at '+l.bpm[1])+'</div>';
  if(t>l.bpm[0])x+='<div class="foot-links"><button class="foot-link" onclick="stepDown(\''+l.id+'\')">Too fast? Back to '+r[Math.max(0,r.indexOf(t)-1)]+'</button></div>';return x;}
 const ready=l.stds.every((_,i)=>s.stds[i])&&(!l.cp||s.recorded);
 return '<button class="master-btn '+(ready?'ready':'notready')+'"'+(ready?' onclick="markMastered()"':' aria-disabled="true"')+'>'+(l.cp?'Pass the final take':'Mark mastered')+'</button>'+(ready?'':'<div class="gate-hint">'+(l.cp&&!s.recorded?'Tick the recording and every standard to finish.':'Tick every standard to unlock this.')+'</div>');}
let curId=null;
function openLesson(id,keep){const det=document.getElementById('detail');const sc=keep?det.scrollTop:0;
 if(!keep&&statusOf(id)==='locked')return;
 curId=id;const l=lessonById(id),s=st(id),m=stageOf(id);
 document.getElementById('dCrumb').textContent='Stage '+m.n+' · '+(l.cp?'Final take':'Lesson '+lessonNo(id));
 const chips=lessonChips(l);if(l.sec){const r=secRange(l.sec);chips.push(secLabel(r[0])+(r[1]>r[0]?' → '+secLabel(r[1]):''));}
 let h='<h1 class="display d-title">'+l.t+'</h1><p class="d-focus">'+l.f+'</p>'+(chips.length?'<div class="chips-row" style="margin-top:12px">'+chips.map(c=>'<span class="chip2">'+c+'</span>').join('')+'</div>':'');
 h+=practicePanel(l,false);
 if(l.cp){
  h+='<div class="cp-note"><b>What to record.</b> '+l.rec.join(' ')+'</div>';
  h+=acc('rec','Recording',s.recorded?'done':'not yet',itemHTML(s.recorded,'toggleRec()','I have recorded the whole take.'));
 }else h+=acc('tasks','How to practise',l.tasks.length+' steps',l.tasks.map((t,i)=>itemHTML(s.tasks[i],'toggleTask('+i+')',t)).join(''));
 const nStd=l.stds.filter((_,i)=>s.stds[i]).length;
 h+=acc('stds','Standards',nStd+' of '+l.stds.length,l.stds.map((t,i)=>itemHTML(s.stds[i],'toggleStd('+i+')',t,'std')).join('')+(l.bpm?'<p class="card-foot">Ticks itself when you confirm a clean run at '+l.bpm[1]+'.</p>':''));
 if(l.cp)h+=acc('notes','Review notes','',  '<textarea class="notes" placeholder="Paste feedback or your own assessment…" onchange="saveNotes(this.value)">'+escapeHtml(s.review||'')+'</textarea>');
 else h+=acc('log','Practice log',s.logs.length+' session'+(s.logs.length===1?'':'s'),renderLogForm()+renderLogList(s));
 h+='<div class="d-gap"></div><div class="d-foot" id="dFoot">'+footHTML(l,s)+'</div>';
 document.getElementById('dBody').innerHTML=h;
 det.classList.add('open');document.getElementById('scrim').classList.add('open');document.body.style.overflow='hidden';det.scrollTop=sc;}
function closeDetail(){document.getElementById('detail').classList.remove('open');curId=null;if(!SES)document.getElementById('scrim').classList.remove('open');if(!anyOverlay())document.body.style.overflow='';render();}
function closeOverlays(){if(SES)endSession();else closeDetail();}
function toggleTask(i){const s=st(curId);s.tasks[i]=!s.tasks[i];persist();openLesson(curId,true);}
function toggleStd(i){const s=st(curId);s.stds[i]=!s.stds[i];persist();openLesson(curId,true);}
function toggleRec(){const s=st(curId);s.recorded=!s.recorded;persist();openLesson(curId,true);}
function saveNotes(v){st(curId).review=v;persist();}
function markMastered(){masterLesson(curId);}
function unmark(){st(curId).mastered=false;persist();openLesson(curId,true);}
function fmtLogDate(ts){try{return new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}catch(e){return '';}}
function renderLogForm(){return '<div class="log-form"><div class="log-row"><input class="log-min" id="logMin" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Minutes practised"><span class="log-min-label">minutes practised</span></div><textarea class="log-note" id="logNote" placeholder="What felt clean, the tempo you reached, what to chase next time…" aria-label="Session note"></textarea><button class="log-add" onclick="addLog()">Log session</button></div>';}
function renderLogList(s){const logs=s.logs||[];if(!logs.length)return '<div class="log-empty">No sessions logged yet.</div>';
 const tot=logs.reduce((a,e)=>a+(e.min||0),0);let h='<div class="log-rollup">'+logs.length+(logs.length===1?' session':' sessions')+(tot>0?' · '+tot+' min total':'')+'</div><div class="log-list">';
 logs.forEach((e,i)=>{const meta=(e.min!=null?e.min+' min':'')+(e.migrated?(e.min!=null?' · ':'')+'earlier note':'');
  h+='<div class="log-entry"><div class="log-head"><span class="log-date">'+fmtLogDate(e.ts)+'</span>'+(meta?'<span class="log-meta">'+meta+'</span>':'')+'<button class="log-del" onclick="deleteLog('+i+')" aria-label="Delete this log">'+ico('x')+'</button></div>'+(e.note?'<div class="log-body">'+escapeHtml(e.note)+'</div>':'')+'</div>';});
 return h+'</div>';}
function addLog(){const s=st(curId),mv=(document.getElementById('logMin').value||'').trim(),note=(document.getElementById('logNote').value||'').trim();const min=mv===''?null:Math.max(0,parseInt(mv,10)||0);
 if(min===null&&note===''){showToast('Add a time or a note first');return;}
 s.logs.unshift({ts:Date.now(),min:min,note:note});markDay();showToast('Session logged');openLesson(curId,true);}
function deleteLog(i){if(!confirm('Delete this session log?'))return;st(curId).logs.splice(i,1);persist();openLesson(curId,true);}

/* ===================== THE 10-MINUTE SESSION ===================== */
let SES=null,sesTick=null;
const SES_STEPS={gym:{t:'Barre gym',sec:120},lesson:{t:'',sec:360},top:{t:'Play from the top',sec:120}};
function stepTitle(k){return k==='lesson'?lessonById(SES.id).t:SES_STEPS[k].t;}
function startSession(only){const id=nextLessonId();const steps=only==='top'?['top']:['gym'].concat(id?['lesson']:[],['top']);
 SES={steps:steps,i:0,id:id};document.getElementById('sess').classList.add('open');document.getElementById('scrim').classList.add('open');document.body.style.overflow='hidden';
 renderSession();startTimer();}
function startTimer(){clearInterval(sesTick);SES.t0=Date.now();paintTimer();sesTick=setInterval(paintTimer,1000);}
function paintTimer(){if(!SES)return;const tot=SES_STEPS[SES.steps[SES.i]].sec,left=Math.max(0,tot-Math.floor((Date.now()-SES.t0)/1000));const el=document.getElementById('sTimer');
 el.textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Time';el.classList.toggle('up',left===0);}
function renderSession(){const k=SES.steps[SES.i],n=SES.steps.length,l=SES.id?lessonById(SES.id):null;
 document.getElementById('sCrumb').textContent=(n>1?'Step '+(SES.i+1)+' of '+n+' · ':'')+stepTitle(k);
 let h=n>1?'<div class="sess-steps" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+SES.steps.map((s,i)=>'<i class="'+(i<SES.i?'done':(i===SES.i?'on':''))+'"></i>').join('')+'</div>':'';
 if(k==='gym'){const g=gymPick();h+='<div class="eyebrow" style="margin-top:18px">2 minutes · Barre gym</div><h1 class="display d-title" style="margin-top:6px">'+g.c+' barre</h1><div class="pcard">'+gymPanel()+'</div>';}
 if(k==='lesson'){const ph=practicePanel(l,true);
  h+='<div class="eyebrow" style="margin-top:18px">6 minutes · Stage '+stageOf(l.id).n+'</div><h1 class="display d-title" style="margin-top:6px">'+l.t+'</h1><p class="d-focus">'+l.f+'</p>'+
   (ph||'<div class="pcard"><ul class="tips">'+(l.rec||l.tasks).map(t=>'<li>'+t+'</li>').join('')+'</ul></div>');}
 if(k==='top'){const r=topRange();
  h+='<div class="eyebrow" style="margin-top:18px">2 minutes · The payoff</div><h1 class="display d-title" style="margin-top:6px">Play from the top</h1><p class="d-focus">'+(r.none?'Strum along to the intro with the band — that’s where your first lesson starts.':'Everything you’ve learnt so far, start to finish, without stopping: '+topLabel()+'.')+'</p>'+
   '<div class="pcard"><div class="pcard-h"><span>With the band</span><span>'+topTempo()+' bpm</span></div><div class="prow"><button class="pbtn" onclick="playTop()">'+ico('play')+'Play from the top</button></div><p class="pnote">Mistakes are fine — keep going. Getting to the end is the skill.</p></div>';}
 const last=SES.i===n-1;
 h+='<div class="d-gap"></div><div class="d-foot"><button class="master-btn ready" onclick="'+(last?'finishSession()':'nextStep()')+'">'+(last?'Finish — count today':'Next: '+stepTitle(SES.steps[SES.i+1]))+'</button>'+(k==='lesson'?'<div class="foot-links"><button class="foot-link" onclick="openFromSession()">Open the full lesson</button></div>':'')+'</div>';
 document.getElementById('sBody').innerHTML=h;}
function nextStep(){SES.i++;document.getElementById('sess').scrollTop=0;renderSession();startTimer();}
function finishSession(){markDay();const n=curStreak();endSession();showToast('Today counted'+(n>1?' · '+n+'-day streak':''));}
function endSession(){clearInterval(sesTick);SES=null;document.getElementById('sess').classList.remove('open');if(!document.getElementById('detail').classList.contains('open'))document.getElementById('scrim').classList.remove('open');if(!anyOverlay())document.body.style.overflow='';render();}
function openFromSession(){const id=SES.id;endSession();openLesson(id);}

/* ===================== BACKUP ===================== */
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.toggle('top',anyOverlay());t.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function doExport(){const blob=new Blob([JSON.stringify({lessons:S,meta:M,exported:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ruyan-mastery-backup-'+todayStr()+'.json';a.click();showToast('Backup downloaded');}
function doImport(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.lessons){S=d.lessons;M=d.meta||{};normMeta();migrate();persist();render();showToast('Progress restored');}else showToast('Not a 如烟 backup');}catch(e){showToast('Could not read that file');}};r.readAsText(f);ev.target.value='';}
function doReset(){if(!confirm('Erase all progress, practice days and gym logs, and start fresh? Back up first if unsure.'))return;S={};M={};normMeta();M.v2=1;persist();render();showToast('Progress reset');}

/* ===================== METRONOME ===================== */
const Metro=(function(){
 let ac=null,timer=null,nextT=0,beat=0,BPM=76,BEATS=4,on=false,taps=[];
 const K='ruyan_metro_bpm';
 function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac;}
 function clamp(v){return Math.max(40,Math.min(200,Math.round(v)));}
 function click(t,accent){const c=ctx();const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=accent?1600:1050;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,t+0.001);g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.06);}
 function flash(i){document.querySelectorAll('.metro-dot').forEach((el,k)=>el.classList.toggle('beat',k===i));}
 function sched(){const c=ctx();while(nextT<c.currentTime+0.13){const i=beat%BEATS;click(nextT,i===0);setTimeout(()=>{if(on)flash(i);},Math.max(0,(nextT-c.currentTime)*1000));nextT+=60/BPM;beat++;}}
 function panelOpen(){const p=document.getElementById('metroPanel');return !!(p&&p.classList.contains('open'));}
 function ui(){const b=document.getElementById('metroBpm');if(b)b.textContent=BPM;const s=document.getElementById('metroSlider');if(s&&+s.value!==BPM)s.value=BPM;
  const ic=document.getElementById('metroStartIcon');if(ic)ic.innerHTML=ico(on?'stop':'play');const tx=document.getElementById('metroStartTxt');if(tx)tx.textContent=on?'Stop':'Start';
  const pill=document.getElementById('metroPill');if(pill)pill.classList.toggle('on',on&&!panelOpen());const pv=document.getElementById('metroPillV');if(pv)pv.textContent=BPM;}
 function start(b){const c=ctx();c.resume();if(b)BPM=clamp(b);if(!on){on=true;beat=0;nextT=c.currentTime+0.08;timer=setInterval(sched,25);}openPanel(true);save();if(typeof markDay==='function')markDay();}
 function stop(){on=false;if(timer)clearInterval(timer);timer=null;document.querySelectorAll('.metro-dot').forEach(d=>d.classList.remove('beat'));ui();}
 function toggle(){on?stop():start();}
 function setBpm(v){BPM=clamp(v);ui();save();}
 function nudge(d){setBpm(BPM+d);}
 function tap(){const now=Date.now();taps=taps.filter(t=>now-t<2000);taps.push(now);if(taps.length>=2){let sum=0;for(let i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];setBpm(60000/(sum/(taps.length-1)));}}
 function openPanel(force){const p=document.getElementById('metroPanel');if(!p)return;if(force)p.classList.add('open');else p.classList.toggle('open');ui();}
 function close(){const p=document.getElementById('metroPanel');if(p)p.classList.remove('open');ui();}
 function save(){if(OK)try{localStorage.setItem(K,String(BPM));}catch(e){}}
 function load(){if(OK)try{const v=parseInt(localStorage.getItem(K),10);if(v)BPM=clamp(v);}catch(e){}}
 return {start,stop,toggle,setBpm,nudge,tap,openPanel,close,load,ui,get bpm(){return BPM;},get on(){return on;}};
})();

/* ===================== START ===================== */
init();
Metro.load();Metro.ui();
render();
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
 if(document.getElementById('menu').classList.contains('open'))toggleMenu(false);
 else if(document.getElementById('playerModal').classList.contains('open'))closePlayer();
 else if(document.getElementById('metroPanel').classList.contains('open'))Metro.close();
 else if(SES)endSession();
 else if(document.getElementById('detail').classList.contains('open'))closeDetail();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
